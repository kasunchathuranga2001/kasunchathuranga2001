name: Smart Campus CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'PAF/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'PAF/**'

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PAF/backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean compile -DskipTests
    
    - name: Run Tests
      run: mvn test
    
    - name: Package
      run: mvn package -DskipTests
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: PAF/backend/target/*.jar

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PAF/frontend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: PAF/frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci || npm install
    
    - name: Build
      run: npm run build
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: PAF/frontend/dist

  code-quality:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Code quality checks passed
      run: echo "All builds completed successfully!"
